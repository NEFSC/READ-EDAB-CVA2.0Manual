on:
  push:
    branches: 
      - main
      - i2-update-narratives
  workflow_dispatch:

name: Render and Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v2 
        
      - name: Set up R (needed for Rmd)
        uses: r-lib/actions/setup-r@v2

      - name: Install packages (needed for Rmd)
        run: Rscript -e 'install.packages(c("rmarkdown", "knitr", "jsonlite", "here", "terra", "cmocean"))'

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # To install LaTeX to build PDF book 
          tinytex: false
          # uncomment below and fill to pin a version
          # version: 0.9.600
      
      #render narrative PDFs
      # 1. Add this step to install the PDF engine
      - name: Install TinyTeX
        run: quarto install tinytex

      # 2. Add this step to generate the PDFs
      - name: Render Narratives to PDF
        run: |
          for file in chapters/*.qmd; do
            if [ "$file" != "chapters/index.qmd" ]; then
              # Extract just the filename without the 'chapters/' path or '.qmd' extension
              base=$(basename "$file" .qmd)
              
              # Force Quarto to use the chapter name and put it directly in the pdfs folder
              quarto render "$file" --to pdf --output "$base.pdf" --output-dir pdfs
            fi
          done
      # add software dependencies here

