on:
  push:
    branches: 
      - main
      - i2-update-narratives
  workflow_dispatch:

name: Render and Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v2 
        
      - name: Set up R (needed for Rmd)
        uses: r-lib/actions/setup-r@v2

      - name: Install packages (needed for Rmd)
        run: Rscript -e 'install.packages(c("rmarkdown", "knitr", "jsonlite", "here", "terra", "cmocean"))'

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # To install LaTeX to build PDF book 
          tinytex: false
          # uncomment below and fill to pin a version
          # version: 0.9.600
      
      #render narrative PDFs
      # 1. Add this step to install the PDF engine
      - name: Install TinyTeX
        run: quarto install tinytex

      # 2. Add this step to generate the PDFs
      - name: Render Narratives to PDF
        run: |
          # Hide the config file so Quarto doesn't treat this as a book
          mv _quarto.yml _quarto.yml.hidden
          # 1. Add your new file to the end of the loop list (replace 'your_file.qmd')
          for file in chapters/*.qmd content/species_narrative_intro.qmd; do
            if [ "$file" != "chapters/index.qmd" ]; then
              
              base=$(basename "$file" .qmd)
              
              # Render the file
              quarto render "$file" --to pdf -M crossref-chapters:false -M project-type:default --output "$base.pdf"
          
              # Move the file to the same directory as the source .qmd file
              mv "$base.pdf" "$(dirname "$file")/$base.pdf"
              
            fi
          done
          
          # Restore the config file for the final HTML book publish step
          mv _quarto.yml.hidden _quarto.yml
      
      # 3. Upload the generated PDFs so you can download them
      - name: Upload PDF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: narrative-pdfs
          path: pdfs/*.pdf

